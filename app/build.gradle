plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.lume.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.lume.launcher'
        minSdk 22
        // 28 = Fire OS 7. Tenerlo a 28 evita le restrizioni di visibilita'
        // dei pacchetti di Android 11+, quindi vedi tutte le app installate.
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Nessuna dipendenza: solo il framework Android, quindi l'APK resta minuscolo.
